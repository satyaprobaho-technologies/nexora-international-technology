name: Deploy Firestore security rules

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "firestore.rules"
      - "firebase.json"
      - ".github/workflows/deploy-firestore.yml"

permissions:
  contents: read

jobs:
  deploy-rules:
    if: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
      - name: Install Firebase CLI
        run: npm install --global firebase-tools
      - name: Deploy Firestore rules
        run: firebase deploy --only firestore:rules --project nexora-technology --non-interactive
